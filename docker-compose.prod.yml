# Prod overlay: pre-built images, no source mounts, prod env files only.
# Run with:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The --env-file flag is required so that ${LOKI_BASIC_AUTH} and
# ${PROMETHEUS_ADMIN_PASSWORD} are resolved at compose-parse time.
#
# Required on the host:
#   /.env.prod                 — POSTGRES_*, GRAFANA_ADMIN_PASSWORD, VITE_API_URL,
#                                LOKI_BASIC_AUTH, PROMETHEUS_ADMIN_PASSWORD
#   /backend/.env.prod         — SECRET_KEY, MISTRAL_API_KEY, CORS_ORIGINS, etc.
#   /loki-proxy/htpasswd       — bcrypt entry for the Loki basic-auth user
#                                (generate with: htpasswd -nbB user password)
#   /prometheus-web.yml        — bcrypt entry for the Prometheus basic-auth user
#                                (copy from prometheus-web.yml.example and fill in hash)
#
# Backups: managed natively on the DB server. See deploy/DB_SERVER.md.

services:
  frontend:
    image: ghcr.io/samyachd/mairie/frontend:latest
    # Bind 127.0.0.1:80 so the host's reverse proxy (Apache) handles TLS
    # and public exposure. Drop the 127.0.0.1 prefix only if no reverse proxy.
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  backend:
    image: ghcr.io/samyachd/mairie/backend:latest
    env_file:
      - .env.prod
      - backend/.env.prod
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Backups are managed natively on the DB server via cron + pg_dump.
  # See deploy/DB_SERVER.md § Backup script.

  prometheus:
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    env_file:
      - .env.prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  loki:
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ─────────────────────────────────────────────────────────────────
  # Basic-auth in front of Loki. Promtail and Grafana point at this
  # service ("loki-proxy:3100"), not the raw loki container, so there
  # is no unauthenticated path to the log store on the docker network.
  # ─────────────────────────────────────────────────────────────────
  loki-proxy:
    image: nginx:alpine
    volumes:
      - ./loki-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./loki-proxy/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  promtail:
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.prod.yml:/etc/promtail/config.yml
    environment:
      LOKI_BASIC_AUTH: ${LOKI_BASIC_AUTH}
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    depends_on:
      - loki-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  prometheus_data:
  loki_data:
