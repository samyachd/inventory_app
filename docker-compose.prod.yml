# Prod overlay: pre-built images, no source mounts.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required on the host (gitignored, set once per server):
#   /.env                      — POSTGRES_*, GRAFANA_ADMIN_PASSWORD,
#                                LOKI_BASIC_AUTH, PROMETHEUS_ADMIN_PASSWORD,
#                                BACKUP_TARGET
#   /backend/.env              — SECRET_KEY, MISTRAL_API_KEY, CORS_ORIGINS, etc.
#   /loki-proxy/htpasswd       — bcrypt entry for the Loki basic-auth user
#                                (generate with: htpasswd -nbB user password)
#   /prometheus-web.yml        — bcrypt entry for the Prometheus basic-auth user
#                                (copy from prometheus-web.yml.example and fill in hash)

services:
  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  db-backup:
    image: prodrigestivill/postgres-backup-local
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 12
    volumes:
      - ${BACKUP_TARGET}:/backups
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  frontend:
    image: ghcr.io/samyachd/mairie/frontend:latest
    # Bind 127.0.0.1:80 so the host's Apache handles TLS and public exposure.
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  backend:
    image: ghcr.io/samyachd/mairie/backend:latest
    env_file:
      - .env
      - backend/.env
    volumes:
      - ./data:/data
    environment:
      CLEAN_EXTRACTS_DIR: /data/clean_extracts
      RAW_EXTRACTS_DIR: /data/raw_extracts
      OTEL_ENDPOINT: "http://tempo:4318/v1/traces"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  prometheus:
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  tempo:
    volumes:
      - tempo_data:/var/tempo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  loki:
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  loki-proxy:
    image: nginx:alpine
    volumes:
      - ./loki-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./loki-proxy/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  promtail:
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.prod.yml:/etc/promtail/config.yml
    environment:
      LOKI_BASIC_AUTH: ${LOKI_BASIC_AUTH}
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    depends_on:
      - loki-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
