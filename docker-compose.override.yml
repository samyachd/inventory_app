services:
  db:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # accessible depuis DBeaver/pgAdmin

  backend:
    build:
      args:
        DEV: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      # Expose raw + cleaned dumps to the seed script and clean_to_models util.
      # Auto-detected by db.seed; explicit env below makes it greppable.
      - ./data:/data
    environment:
      OTEL_ENDPOINT: "http://tempo:4318/v1/traces"
      CLEAN_EXTRACTS_DIR: /data/clean_extracts
    depends_on:
      db:
        condition: service_healthy
      tempo:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev   # ← On cible le stage "dev"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  prometheus:
    ports:
      - "9090:9090"
    volumes:
      # Mount the rule file referenced by rule_files (base compose only mounts
      # prometheus.yml, so without this the alerts never load in dev).
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro

  # Local Alertmanager for demoing email alerts. Reads alertmanager.yml
  # (gitignored — holds the Gmail App Password). UI on http://localhost:9093.
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    ports:
      - "3001:3000"

  tempo:
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  loki:
    ports:
      - "3100:3100"
