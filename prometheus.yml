global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "mairie_backend"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
      # ↑ en dev — backend tourne sur ta machine, pas dans Docker
      # En prod → targets: ["backend:8000"]
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # CAPTURER LES METRIQUES DE POSTGRES
  - job_name: 'postgres'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter:9187']