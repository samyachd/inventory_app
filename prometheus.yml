global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

# Send firing alerts to Alertmanager (added to the dev stack via
# docker-compose.override.yml). Harmless if alertmanager isn't running —
# Prometheus just logs that it can't reach it.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "mairie_backend"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
      # ↑ en dev — backend tourne sur ta machine, pas dans Docker
      # En prod → targets: ["backend:8000"]
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # CAPTURER LES METRIQUES DE POSTGRES
  - job_name: 'postgres'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter:9187']