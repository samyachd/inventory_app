readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic>=2.12.5",
    "alembic>=1.17.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.11",
    "passlib>=1.7.4",
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.5.0",
